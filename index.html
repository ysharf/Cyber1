<style>
  /* ================= THEME ENGINE ================= */
  :root, [data-theme="emerald"] {
    --bg-abyss: #040811;
    --glass-surface: rgba(11, 19, 32, 0.85);
    --glass-elevated: rgba(17, 28, 46, 0.92);
    --glass-card-hover: rgba(22, 36, 58, 0.95);
    --glass-input: rgba(6, 11, 20, 0.9);
    --dropdown-bg: rgba(9, 16, 28, 0.98);
    --text-main: #f0fdf4;
    --text-muted: #8ea3bf;
    --border-glass: rgba(255, 255, 255, 0.09);
    --border-specular: rgba(255, 255, 255, 0.16);
    --accent: #10b981;
    --accent-light: #34d399;
    --accent-glow: rgba(16, 185, 129, 0.25);
    --accent-soft: rgba(16, 185, 129, 0.13);
    --accent-gradient: linear-gradient(135deg, #34d399 0%, #10b981 50%, #059669 100%);
    --orb-1: rgba(16, 185, 129, 0.22);
    --orb-2: rgba(6, 182, 212, 0.18);
    --orb-3: rgba(59, 130, 246, 0.14);
    --danger: #f43f5e;
    color-scheme: dark;
  }

  [data-theme="cyber"] {
    --bg-abyss: #06040f;
    --glass-surface: rgba(17, 12, 36, 0.85);
    --glass-elevated: rgba(26, 19, 52, 0.92);
    --glass-card-hover: rgba(34, 25, 68, 0.95);
    --glass-input: rgba(8, 5, 18, 0.9);
    --dropdown-bg: rgba(13, 9, 28, 0.98);
    --text-main: #f5f3ff;
    --text-muted: #9e94bd;
    --accent: #8b5cf6;
    --accent-light: #c084fc;
    --accent-glow: rgba(139, 92, 246, 0.28);
    --accent-soft: rgba(139, 92, 246, 0.15);
    --accent-gradient: linear-gradient(135deg, #c084fc 0%, #8b5cf6 50%, #6d28d9 100%);
    --orb-1: rgba(139, 92, 246, 0.24);
    --orb-2: rgba(236, 72, 153, 0.18);
    --orb-3: rgba(59, 130, 246, 0.15);
  }

  [data-theme="crimson"] {
    --bg-abyss: #090306;
    --glass-surface: rgba(26, 11, 18, 0.85);
    --glass-elevated: rgba(38, 16, 25, 0.92);
    --glass-card-hover: rgba(48, 20, 32, 0.95);
    --glass-input: rgba(12, 4, 8, 0.9);
    --dropdown-bg: rgba(20, 8, 14, 0.98);
    --text-main: #fff1f2;
    --text-muted: #b88f9c;
    --accent: #f43f5e;
    --accent-light: #fb7185;
    --accent-glow: rgba(244, 63, 94, 0.28);
    --accent-soft: rgba(244, 63, 94, 0.15);
    --accent-gradient: linear-gradient(135deg, #fb7185 0%, #f43f5e 50%, #be123c 100%);
    --orb-1: rgba(244, 63, 94, 0.22);
    --orb-2: rgba(249, 115, 22, 0.16);
    --orb-3: rgba(168, 85, 247, 0.14);
  }

  [data-theme="aqua"] {
    --bg-abyss: #02080d;
    --glass-surface: rgba(10, 23, 36, 0.85);
    --glass-elevated: rgba(15, 34, 52, 0.92);
    --glass-card-hover: rgba(20, 43, 66, 0.95);
    --glass-input: rgba(5, 13, 22, 0.9);
    --dropdown-bg: rgba(7, 18, 29, 0.98);
    --text-main: #ecfeff;
    --text-muted: #88a8bd;
    --accent: #06b6d4;
    --accent-light: #22d3ee;
    --accent-glow: rgba(6, 182, 212, 0.28);
    --accent-soft: rgba(6, 182, 212, 0.15);
    --accent-gradient: linear-gradient(135deg, #22d3ee 0%, #06b6d4 50%, #0284c7 100%);
    --orb-1: rgba(6, 182, 212, 0.24);
    --orb-2: rgba(59, 130, 246, 0.2);
    --orb-3: rgba(16, 185, 129, 0.15);
  }

  [data-theme="gold"] {
    --bg-abyss: #070603;
    --glass-surface: rgba(22, 18, 11, 0.86);
    --glass-elevated: rgba(34, 28, 16, 0.92);
    --glass-card-hover: rgba(44, 36, 22, 0.95);
    --glass-input: rgba(12, 10, 5, 0.9);
    --dropdown-bg: rgba(18, 15, 8, 0.98);
    --text-main: #fefce8;
    --text-muted: #afa386;
    --accent: #eab308;
    --accent-light: #facc15;
    --accent-glow: rgba(234, 179, 8, 0.26);
    --accent-soft: rgba(234, 179, 8, 0.15);
    --accent-gradient: linear-gradient(135deg, #fde047 0%, #eab308 50%, #ca8a04 100%);
    --orb-1: rgba(234, 179, 8, 0.22);
    --orb-2: rgba(245, 158, 11, 0.16);
    --orb-3: rgba(161, 98, 7, 0.14);
  }

  /* ================= RESET & GROUNDED LAYOUT ================= */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background-color: var(--bg-abyss);
    color: var(--text-main);
    font-family: "Cairo", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 14px;
    position: relative;
  }

  /* ================= STATIC AMBIENT BACKGROUND (NO FLOATING) ================= */
  .cosmos-bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
    background: radial-gradient(circle at 50% 35%, rgba(15, 23, 42, 0.4), var(--bg-abyss) 85%);
    pointer-events: none;
  }

  .cyber-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at 50% 40%, black 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 40%, black 20%, transparent 80%);
  }

  .ambient-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    opacity: 0.65;
    pointer-events: none;
  }

  .orb-1 {
    width: 460px;
    height: 460px;
    background: var(--orb-1);
    top: -120px;
    right: 8%;
  }

  .orb-2 {
    width: 500px;
    height: 500px;
    background: var(--orb-2);
    bottom: -160px;
    left: 5%;
  }

  .orb-3 {
    width: 340px;
    height: 340px;
    background: var(--orb-3);
    top: 35%;
    left: 38%;
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* ================= STATIONARY GLASS SURFACE ================= */
  .glass-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--border-glass);
    border-top: 1px solid var(--border-specular);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  }

  /* ================= TOP HEADER ================= */
  .app-header {
    height: 66px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 60;
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .menu-toggle {
    display: none;
    background: var(--glass-elevated);
    border: 1px solid var(--border-specular);
    color: var(--text-main);
    width: 40px;
    height: 40px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1.15rem;
  }

  .brand-logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--accent-gradient);
    display: grid;
    place-items: center;
    font-size: 1.25rem;
    box-shadow: 0 4px 14px var(--accent-glow);
  }

  .brand-title h1 {
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: 0.2px;
    background: linear-gradient(90deg, #ffffff, var(--accent-light));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .brand-title span {
    font-size: 0.74rem;
    color: var(--text-muted);
    display: block;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* View Switcher Pills */
  .nav-pills {
    display: flex;
    background: var(--glass-input);
    border: 1px solid var(--border-glass);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }

  .nav-pills button {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 9px;
    font-family: inherit;
    font-size: 0.84rem;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .nav-pills button:hover {
    color: var(--text-main);
  }

  .nav-pills button.active {
    background: var(--accent-gradient);
    color: #030706;
  }

  /* Theme Dots */
  .theme-picker {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--glass-input);
    border: 1px solid var(--border-glass);
    padding: 7px 12px;
    border-radius: 12px;
  }

  .theme-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .theme-dot.active {
    border-color: #ffffff;
    box-shadow: 0 0 10px currentColor;
  }
  .dot-emerald { background: #10b981; color: #10b981; }
  .dot-cyber { background: #8b5cf6; color: #8b5cf6; }
  .dot-crimson { background: #f43f5e; color: #f43f5e; }
  .dot-aqua { background: #06b6d4; color: #06b6d4; }
  .dot-gold { background: #eab308; color: #eab308; }

  /* ================= BODY WORKSPACE ================= */
  .app-body {
    display: flex;
    flex: 1;
    gap: 16px;
    overflow: hidden;
    position: relative;
  }

  /* SIDEBAR */
  .sidebar {
    width: 350px;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
    z-index: 40;
  }

  .sidebar-top {
    padding: 16px;
    border-bottom: 1px solid var(--border-glass);
    background: rgba(255, 255, 255, 0.015);
  }

  .progress-box {
    background: var(--glass-input);
    border: 1px solid var(--border-glass);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .progress-header span:last-child { color: var(--accent-light); }

  .progress-bar-bg {
    height: 8px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--accent-gradient);
    border-radius: 99px;
    transition: width 0.35s ease;
  }

  .search-wrapper {
    position: relative;
  }

  .search-wrapper input {
    width: 100%;
    background: var(--glass-input);
    border: 1px solid var(--border-glass);
    color: var(--text-main);
    padding: 10px 36px 10px 14px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.84rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-wrapper input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .search-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 0.88rem;
    pointer-events: none;
  }

  /* Sidebar Accordion */
  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  .nav-phase {
    margin-bottom: 9px;
    border: 1px solid var(--border-glass);
    border-radius: 13px;
    background: rgba(5, 9, 18, 0.5);
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .nav-phase:hover {
    border-color: rgba(255, 255, 255, 0.18);
  }

  .nav-phase.active-phase {
    border-color: var(--accent);
  }

  .nav-phase-header {
    width: 100%;
    background: var(--glass-elevated);
    border: none;
    color: var(--text-main);
    padding: 11px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.83rem;
    text-align: right;
    gap: 8px;
    transition: background 0.2s;
  }

  .nav-phase-header:hover {
    background: var(--glass-card-hover);
  }

  .phase-badge {
    background: var(--glass-input);
    color: var(--accent-light);
    border: 1px solid var(--border-glass);
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 99px;
    white-space: nowrap;
  }

  .nav-lessons {
    display: none;
    padding: 8px;
    border-top: 1px solid var(--border-glass);
  }

  .nav-phase.open .nav-lessons { display: block; }

  .nav-lesson-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--text-muted);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    margin-bottom: 3px;
    direction: ltr;
    text-align: left;
    border: 1px solid transparent;
  }

  .nav-lesson-item:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-main);
  }

  .nav-lesson-item.selected {
    background: var(--accent-soft);
    color: var(--accent-light);
    font-weight: 700;
    border-color: var(--accent);
  }

  .check-btn {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid rgba(255, 255, 255, 0.25);
    background: transparent;
    display: grid;
    place-items: center;
    cursor: pointer;
    color: transparent;
    font-size: 0.68rem;
    flex-shrink: 0;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }

  .check-btn.done {
    background: var(--accent);
    border-color: var(--accent);
    color: #030706;
  }

  .lesson-title-span {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ================= MAIN CONTENT STAGE ================= */
  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 2px 6px 50px 6px;
  }

  .container {
    max-width: 1040px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .view-panel { display: none; }
  .view-panel.active {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* Stationary Studio Cards (No floating / No hover jumping) */
  .studio-card {
    border-radius: 18px;
    padding: 22px;
    position: relative;
    z-index: 1;
    transition: border-color 0.2s ease;
  }

  .studio-card.card-elevated-z {
    z-index: 45;
  }

  .studio-card:hover {
    border-color: rgba(255, 255, 255, 0.16);
  }

  /* Active Lesson: title panel above a consistent action row */
  .hero-banner {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: stretch;
    gap: 12px;
    background: linear-gradient(135deg, var(--glass-elevated), var(--glass-surface));
  }

  .lesson-info-card {
    width: 100%;
    min-width: 0;
    padding: 16px 18px;
    border: 1px solid var(--border-glass);
    border-right: 3px solid var(--accent);
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.14);
  }

  .breadcrumb-phase {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.76rem;
    color: var(--accent-light);
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    padding: 3px 10px;
    border-radius: 99px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .active-lesson-title {
    width: 100%;
    min-width: 0;
    font-size: clamp(1rem, 1.5vw, 1.22rem);
    font-weight: 900;
    line-height: 1.65;
    color: var(--text-main);
    font-family: "JetBrains Mono", "Cairo", monospace;
    direction: ltr;
    text-align: left;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: normal;
  }

  .hero-actions {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    align-items: stretch;
    width: 100%;
  }

  .hero-actions .btn {
    min-width: 0;
    height: 46px;
    justify-content: center;
    padding: 0 12px;
    white-space: nowrap;
    font-size: 0.82rem;
  }

  @media (max-width: 600px) {
    .hero-actions { grid-template-columns: minmax(0, 1fr); }
    .hero-actions .btn { height: 44px; }
    .lesson-info-card { padding: 14px; }
  }

  .card-title {
    font-size: 0.96rem;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Selectors & Inputs Grid */
  .selectors-grid {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 16px;
    margin-bottom: 18px;
  }

  .customizer-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border-glass);
  }

  .field-group {
    position: relative;
  }

  .field-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  input[type="text"] {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--border-glass);
    background: var(--glass-input);
    color: var(--text-main);
    font-size: 0.88rem;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  /* ================= CUSTOM DESIGNED DROPDOWN MENUS ================= */
  .native-select-hidden {
    display: none !important;
  }

  .custom-select {
    position: relative;
    width: 100%;
    user-select: none;
  }

  .custom-select-trigger {
    width: 100%;
    min-height: 46px;
    padding: 10px 14px;
    border-radius: 13px;
    border: 1px solid var(--border-specular);
    background: var(--glass-input);
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.87rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
  }

  .custom-select-trigger:hover {
    border-color: var(--accent);
    background: var(--glass-elevated);
  }

  .custom-select.open .custom-select-trigger {
    border-color: var(--accent);
    background: var(--glass-elevated);

  .custom-select[data-dir="ltr"] .custom-select-option {

  /* Toggle Chips (Stationary) */

  .chip-toggle {

  .editor-phase-card {

  .icon-btn {
    background: var(--glass-input);

    height: 34px;
    cursor: pointer;
    font-size: 0.85rem;
    display: grid;
    place-items: center;

    color: var(--accent-light);

    font-family: "JetBrains Mono", monospace;
  }

  .flex-row { display: flex; gap: 10px; }

  /* Custom Confirmation Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 5, 11, 0.78);
    backdrop-filter: blur(8px);
    display: none;
    place-items: center;
    z-index: 2000;
    padding: 16px;
  }
  .modal-backdrop.open {
    display: grid;
  }
  .modal-box {
    width: 100%;

  .modal-actions {

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 24px;

  .toast.show { opacity: 1; }

  /* Responsive Design */
  @media (max-width: 960px) {
    body { padding: 10px; gap: 10px; }

  /* ================= REFINED, QUIET DESIGN LAYER ================= */

  <!-- ================= STATIC AMBIENT BACKGROUND ================= -->

function openConfirmModal(title, desc, onConfirm) {

/* ================= CUSTOM DROPDOWN ENGINE ================= */
const customDropdownRegistry = [];

function createCustomDropdown(selectEl, containerEl, optionsConfig = {}) {
  const isSearchable = containerEl.dataset.searchable === 'true';

  const trigger = document.createElement('button');
  trigger.type = 'button';
  trigger.className = 'custom-select-trigger';

  const labelSpan = document.createElement('span');
  labelSpan.className = 'custom-select-label';

  const arrowSpan = document.createElement('span');
  arrowSpan.className = 'custom-select-arrow';
  arrowSpan.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

  trigger.appendChild(labelSpan);
  trigger.appendChild(arrowSpan);

  const menu = document.createElement('div');
  menu.className = 'custom-select-menu';

  let searchInput = null;
  if (isSearchable) {
    const searchBox = document.createElement('div');
    searchBox.className = 'custom-select-search-box';
    searchInput = document.createElement('input');
    searchInput.type = 'text';
    searchInput.placeholder = optionsConfig.searchPlaceholder || 'ابحث داخل القائمة...';
    searchBox.appendChild(searchInput);
    menu.appendChild(searchBox);

    searchInput.addEventListener('click', (e) => e.stopPropagation());
    searchInput.addEventListener('input', () => renderOptions(searchInput.value.trim().toLowerCase()));
  }

  if (optionsConfig.multiSelect) {
    const actions = document.createElement('div');
    actions.className = 'custom-select-actions';
    const selectAllBtn = document.createElement('button');
    selectAllBtn.type = 'button';
    selectAllBtn.className = 'custom-select-action';
    selectAllBtn.textContent = 'تحديد كل الدروس';
    selectAllBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      Array.from(selectEl.options).forEach(opt => { opt.selected = true; });
      selectEl.dispatchEvent(new Event('change', { bubbles: true }));
      renderOptions(searchInput ? searchInput.value.trim().toLowerCase() : '');
    });
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'custom-select-action';
    clearBtn.textContent = 'مسح التحديد';
    clearBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      Array.from(selectEl.options).forEach(opt => { opt.selected = false; });
      selectEl.dispatchEvent(new Event('change', { bubbles: true }));
      renderOptions(searchInput ? searchInput.value.trim().toLowerCase() : '');
    });
    actions.appendChild(selectAllBtn);
    actions.appendChild(clearBtn);
    menu.appendChild(actions);
  }

  const optionsList = document.createElement('div');
  optionsList.className = 'custom-select-options';
  menu.appendChild(optionsList);

  containerEl.innerHTML = '';
  containerEl.appendChild(trigger);
  containerEl.appendChild(menu);

  function renderOptions(filterQuery = '') {
    optionsList.innerHTML = '';
    const opts = Array.from(selectEl.options);
    if (optionsConfig.multiSelect) {
      const selectedOptions = opts.filter(opt => opt.selected);
      labelSpan.textContent = selectedOptions.length
        ? `${selectedOptions.length} دروس محددة`
        : 'اختار درسًا أو أكثر';
      trigger.title = selectedOptions.length
        ? selectedOptions.map(opt => opt.textContent).join('، ')
        : 'اختيار عدة دروس من المرحلة الحالية';
    } else {
      const selectedOpt = opts[selectEl.selectedIndex];
      labelSpan.textContent = selectedOpt ? selectedOpt.textContent : 'اختر...';
    }

    let visibleCount = 0;

    opts.forEach((opt, idx) => {
      if (filterQuery && !opt.textContent.toLowerCase().includes(filterQuery)) {
        return;
      }
      visibleCount++;

      const item = document.createElement('div');
      item.className = 'custom-select-option' + (opt.selected ? ' selected' : '');
      item.dataset.value = opt.value;

      const mainWrap = document.createElement('div');
      mainWrap.className = 'opt-main';

      if (optionsConfig.showIndex) {
        const idxBadge = document.createElement('span');
        idxBadge.className = 'opt-index';
        idxBadge.textContent = String(idx + 1).padStart(2, '0');
        mainWrap.appendChild(idxBadge);
      }

      const textSpan = document.createElement('span');
      textSpan.className = 'opt-text';
      textSpan.textContent = opt.textContent;
      mainWrap.appendChild(textSpan);

      const metaWrap = document.createElement('div');
      metaWrap.className = 'opt-meta';

      if (optionsConfig.checkCompleted && completedLessons.has(opt.value)) {
        const donePill = document.createElement('span');
        donePill.className = 'opt-done-pill';
        donePill.textContent = '✓ مكتمل';
        metaWrap.appendChild(donePill);
      }

      if (optionsConfig.phaseBadge) {
        const pObj = state[idx];
        if (pObj) {
          const countBadge = document.createElement('span');
          countBadge.className = 'phase-badge';
          countBadge.textContent = `${pObj.lessons.length} درس`;
          metaWrap.appendChild(countBadge);
        }
      }

      const checkMark = document.createElement('span');
      checkMark.className = 'opt-check';
      checkMark.textContent = '✓';
      metaWrap.appendChild(checkMark);

      item.appendChild(mainWrap);
      item.appendChild(metaWrap);

      item.addEventListener('click', (e) => {
        e.stopPropagation();
        if (optionsConfig.multiSelect) {
          opt.selected = !opt.selected;
          selectEl.dispatchEvent(new Event('change', { bubbles: true }));
          // Keep the lesson menu open so several lessons can be selected consecutively.
          renderOptions(searchInput ? searchInput.value.trim().toLowerCase() : '');
        } else {
          if (selectEl.value !== opt.value) {
            selectEl.value = opt.value;
            selectEl.dispatchEvent(new Event('change'));
          }
          closeAllDropdowns();
          renderOptions();
        }
      });

      optionsList.appendChild(item);
    });

    if (visibleCount === 0) {
      const empty = document.createElement('div');
      empty.className = 'custom-select-empty';
      empty.textContent = 'لا توجد نتائج مطابقة';
      optionsList.appendChild(empty);
    }
  }

  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = containerEl.classList.contains('open');
    closeAllDropdowns();
    if (!isOpen) {
      containerEl.classList.add('open');
      configCard.classList.add('card-elevated-z');
      if (searchInput) {
        searchInput.value = '';
        renderOptions('');
        setTimeout(() => searchInput.focus(), 20);
      } else {
        renderOptions('');
      }
      const activeItem = optionsList.querySelector('.custom-select-option.selected');
      if (activeItem) {
        activeItem.scrollIntoView({ block: 'nearest' });
      }
    }
  });

  const api = {
    container: containerEl,
    refresh: () => renderOptions(searchInput ? searchInput.value.trim().toLowerCase() : '')
  };
  customDropdownRegistry.push(api);
  renderOptions();
  return api;
}

function closeAllDropdowns() {
  customDropdownRegistry.forEach(d => d.container.classList.remove('open'));
  configCard.classList.remove('card-elevated-z');
}

function refreshAllCustomDropdowns() {
  customDropdownRegistry.forEach(d => d.refresh());
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => toastEl.classList.remove('show'), 3200);
}

function defaultState() {
  return DEFAULT_PHASES.map(([name, lessons]) => ({ name, lessons: [...lessons] }));
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    state = raw ? JSON.parse(raw) : defaultState();
  } catch (e) {
    state = defaultState();
  }
  try {
    const rawDone = localStorage.getItem(DONE_KEY);
    if (rawDone) completedLessons = new Set(JSON.parse(rawDone));
  } catch (e) {}
  try {
    const savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme) applyTheme(savedTheme);
  } catch (e) {}
}

function saveData() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

function saveDone() {
  try { localStorage.setItem(DONE_KEY, JSON.stringify([...completedLessons])); } catch (e) {}
}

function applyTheme(themeName) {
  document.documentElement.setAttribute('data-theme', themeName);
  document.querySelectorAll('.theme-dot').forEach(dot => {
    dot.classList.toggle('active', dot.dataset.setTheme === themeName);
  });
  try { localStorage.setItem(THEME_KEY, themeName); } catch (e) {}
}

document.querySelectorAll('.theme-dot').forEach(dot => {
  dot.addEventListener('click', () => applyTheme(dot.dataset.setTheme));
});

  if (customAddons.length) {

function updateProgressStats() {
  let total = 0;
  let done = 0;
  state.forEach(p => {
    p.lessons.forEach(l => {
      total++;
      if (completedLessons.has(l)) done++;
    });
  });
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  progressText.textContent = `${done} / ${total} (${pct}%)`;
  progressBar.style.width = `${pct}%`;
}

function renderSidebar() {
  const query = sidebarSearch.value.trim().toLowerCase();
  sidebarNav.innerHTML = '';

  const currentPhaseIdx = parseInt(phaseSel.value || 0, 10);
  const currentLesson = lessonSel.value;

  state.forEach((p, pi) => {
    const filteredLessons = p.lessons
      .map((l, li) => ({ title: l, index: li }))
      .filter(item => !query || item.title.toLowerCase().includes(query) || p.name.toLowerCase().includes(query));

    if (query && filteredLessons.length === 0) return;

    const phaseBox = document.createElement('div');
    const isOpen = query ? true : openSidebarPhases.has(pi);
    phaseBox.className = `nav-phase ${isOpen ? 'open' : ''} ${pi === currentPhaseIdx ? 'active-phase' : ''}`;

    const doneInPhase = p.lessons.filter(l => completedLessons.has(l)).length;

    const headBtn = document.createElement('button');
    headBtn.className = 'nav-phase-header';
    headBtn.innerHTML = `
      <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${p.name}</span>
      <span class="phase-badge">${doneInPhase}/${p.lessons.length}</span>
    `;
    headBtn.onclick = () => {
      if (openSidebarPhases.has(pi)) openSidebarPhases.delete(pi);
      else openSidebarPhases.add(pi);
      renderSidebar();
    };

    const lessonsContainer = document.createElement('div');
    lessonsContainer.className = 'nav-lessons';

    filteredLessons.forEach(item => {
      const row = document.createElement('div');
      const isSelected = (pi === currentPhaseIdx && item.title === currentLesson);
      row.className = `nav-lesson-item ${isSelected ? 'selected' : ''}`;

      const check = document.createElement('button');
      const isDone = completedLessons.has(item.title);
      check.className = `check-btn ${isDone ? 'done' : ''}`;
      check.textContent = '✓';
      check.title = 'تحديد كمكتمل';
      check.onclick = (e) => {
        e.stopPropagation();
        toggleLessonDone(item.title);
      };

      const titleSpan = document.createElement('span');
      titleSpan.className = 'lesson-title-span';
      titleSpan.textContent = item.title;

      row.appendChild(check);
      row.appendChild(titleSpan);

      row.onclick = () => {
        selectPhaseAndLesson(pi, item.title);
        if (window.innerWidth <= 960) {
          document.getElementById('sidebar').classList.remove('mobile-open');
        }
      };

      lessonsContainer.appendChild(row);
    });

    phaseBox.appendChild(headBtn);
    phaseBox.appendChild(lessonsContainer);
    sidebarNav.appendChild(phaseBox);
  });

  updateProgressStats();
}

function toggleLessonDone(lessonTitle) {
  if (!lessonTitle) return;
  if (completedLessons.has(lessonTitle)) {
    completedLessons.delete(lessonTitle);
    showToast('تم إلغاء علامة الاكتمال للدرس');
  } else {
    completedLessons.add(lessonTitle);
    showToast('تم تسجيل الدرس كمكتمل');
  }
  saveDone();
  syncHeroBanner();
  renderSidebar();
  refreshAllCustomDropdowns();
}

function selectPhaseAndLesson(phaseIdx, lessonTitle) {
  phaseSel.value = phaseIdx;
  openSidebarPhases.add(Number(phaseIdx));
  populateLessonsSelect(lessonTitle);
}

function getSelectedLessons() {
  // Preserve the curriculum order, not the order in which options were clicked.
  return Array.from(lessonSel.options).filter(opt => opt.selected).map(opt => opt.value);
}

function buildPromptForSelection(lessons, phaseName, extra) {
  const selectedLessons = Array.isArray(lessons) ? lessons.filter(Boolean) : [lessons].filter(Boolean);
  if (selectedLessons.length <= 1) {
    return buildPrompt(selectedLessons[0] || '', phaseName, extra);
  }

  // Reuse the complete single-lesson instructions, but replace its lesson context
  // with the actual multi-selection and add precise multi-lesson output rules.
  let prompt = buildPrompt(selectedLessons[0], phaseName, extra);
  const currentPhase = state[Math.max(0, parseInt(phaseSel.value || 0, 10))];
  const multiContext = `المرحلة الحالية: ${phaseName || (currentPhase ? currentPhase.name : 'غير محددة')}\nالدروس المحددة (بنفس ترتيب المنهج):\n${selectedLessons.map((title, i) => `${i + 1}. ${title}`).join('\n')}`;
  prompt = prompt.replace(
    /المرحلة الحالية:[\s\S]*?\n\nخريطة المنهج كاملة \(مصدر إلزامي لفحص الترتيب والتداخل\):/,
    `${multiContext}\n\nخريطة المنهج كاملة (مصدر إلزامي لفحص الترتيب والتداخل):`
  );

  const modeInstruction = outputModeSel.value === 'summary'
    ? `وضع الناتج: ملخص مراجعة موحّد للدروس المحددة. لكل درس، اعرض أهم الأفكار فقط، المصطلحات التي يجب فهمها، الأوامر/الأنماط المهمة مع وظيفة كل منها، الأخطاء الشائعة، وما الذي يجب تذكره. ثم أضف قسمًا يربط بين الدروس ويشرح الفروق التي يسهل الخلط بينها، واختبار مراجعة من 5 أسئلة إجمالًا بلا إجابات. لا تحوّل الملخص إلى شرح طويل ولا تحذف أساسًا ضروريًا لفهم النقاط المختارة.`
    : `وضع الناتج: غطِّ كل درس محدد على حدة وبالترتيب الظاهر، مع الحفاظ على أقسام الشرح المطلوبة لكل درس. لا تتجاهل أي درس، ولا تدمج موضوعين مختلفين في شرح مبهم. تجنّب التكرار: اشرح المتطلب السابق مرة واحدة بإيجاز، ثم وضّح كيف يختلف تطبيقه بين الدروس. في النهاية أضف مقارنة/ترابطًا موجزًا بينها واختبارًا واحدًا من 5 أسئلة إجمالًا يغطي المجموعة كلها دون إجابات.`;

  prompt += `\n\nتعليمات إلزامية لاختيار عدة دروس:\n- عدد الدروس المختارة: ${selectedLessons.length}.\n- عناوين الدروس المختارة هي نطاق المهمة؛ لا تستبدلها أو تضف دروسًا من عندك.\n- التزم بترتيب المنهج وبالمتطلبات السابقة، وميّز ما يحتاج تمهيدًا قصيرًا عما يجب تأجيله.\n- إذا كانت المجموعة كبيرة على إجابة واحدة، قسّم الناتج إلى أجزاء معنونة حسب الدروس ولا تسقط أي درس أو تدّعِ تغطيته قبل شرحه.\n${modeInstruction}`;
  return prompt.replace(/\n{3,}/g, '\n\n').trim();
}

function setSingleLesson(lessonTitle) {
  Array.from(lessonSel.options).forEach(opt => { opt.selected = opt.value === lessonTitle; });
  lessonSel.dispatchEvent(new Event('change', { bubbles: true }));
}

function populateGenerator() {
  const prevPhase = phaseSel.value || 0;
  phaseSel.innerHTML = '';
  state.forEach((p, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = p.name;
    phaseSel.appendChild(opt);
  });
  if (state[prevPhase]) phaseSel.value = prevPhase;
  populateLessonsSelect();
}

function populateLessonsSelect(targetLesson) {
  lessonSel.innerHTML = '';
  const pIdx = parseInt(phaseSel.value || 0, 10);
  const p = state[pIdx];
  (p ? p.lessons : []).forEach(l => {
    const opt = document.createElement('option');
    opt.value = l;
    opt.textContent = l;
    lessonSel.appendChild(opt);
  });
  if (targetLesson && p && p.lessons.includes(targetLesson)) {
    Array.from(lessonSel.options).forEach(opt => { opt.selected = opt.value === targetLesson; });
  } else if (lessonSel.options.length) {
    // A newly chosen phase starts with its first lesson selected.
    lessonSel.options[0].selected = true;
  }
  countEl.textContent = p
    ? `${p.lessons.length} درس في المرحلة دي • ${getSelectedLessons().length} محدد`
    : 'لا توجد دروس';
  forceExtraDepth = false;
  refreshOutput();
  syncHeroBanner();
  renderSidebar();
  refreshAllCustomDropdowns();
}

function syncHeroBanner() {
  const p = state[phaseSel.value];
  const selected = getSelectedLessons();
  heroPhaseBadge.textContent = p ? p.name : 'بدون مرحلة';
  if (!selected.length) {
    heroLessonTitle.textContent = 'اختار درسًا أو أكثر من قائمة الدروس';
  } else if (selected.length === 1) {
    heroLessonTitle.textContent = selected[0];
  } else {
    heroLessonTitle.textContent = `${selected.length} دروس محددة: ${selected.slice(0, 2).join(' • ')}${selected.length > 2 ? ` • و${selected.length - 2} أخرى` : ''}`;
  }

  const allDone = selected.length > 0 && selected.every(title => completedLessons.has(title));
  markDoneBtn.classList.toggle('on', allDone);
  markDoneBtn.textContent = selected.length > 1
    ? (allDone ? 'إلغاء إكمال المحدد' : `إكمال ${selected.length} دروس`)
    : (allDone ? 'إلغاء إكمال الدرس' : 'تم الدرس');
  countEl.textContent = p ? `${p.lessons.length} درس في المرحلة دي • ${selected.length} محدد` : 'لا توجد دروس';
}

function refreshOutput() {
  const p = state[phaseSel.value];
  const selected = getSelectedLessons();
  if (!selected.length) {
    output.value = 'اختار درسًا واحدًا على الأقل من قائمة الدروس لإعداد البرومت.';
  } else {
    output.value = buildPromptForSelection(selected, p ? p.name : '', forceExtraDepth);
  }
  const words = output.value.trim().split(/\s+/).filter(Boolean).length;
  promptStats.textContent = `${words} كلمة • ${output.value.length} حرف`;
}

phaseSel.addEventListener('change', () => {
  openSidebarPhases.add(Number(phaseSel.value));
  populateLessonsSelect();
});

lessonSel.addEventListener('change', () => {
  forceExtraDepth = false;
  refreshOutput();
  syncHeroBanner();
  renderSidebar();
  refreshAllCustomDropdowns();
});

depthSel.addEventListener('change', () => {
  refreshOutput();
  refreshAllCustomDropdowns();
});

focusSel.addEventListener('change', () => {
  refreshOutput();
  refreshAllCustomDropdowns();
});

outputModeSel.addEventListener('change', () => {
  refreshOutput();
  refreshAllCustomDropdowns();
});

document.querySelectorAll('.chip-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.chip;
    if (activeChips.has(key)) activeChips.delete(key);
    else activeChips.add(key);
    btn.classList.toggle('active', activeChips.has(key));
    refreshOutput();
  });
});

sidebarSearch.addEventListener('input', renderSidebar);
markDoneBtn.addEventListener('click', () => {
  const selected = getSelectedLessons();
  if (!selected.length) return;
  const allDone = selected.every(title => completedLessons.has(title));
  selected.forEach(title => {
    if (allDone) completedLessons.delete(title);
    else completedLessons.add(title);
  });
  saveDone();
  syncHeroBanner();
  renderSidebar();
  refreshAllCustomDropdowns();
  showToast(allDone ? 'تم إلغاء إكمال الدروس المحددة' : `تم تحديد ${selected.length} دروس كمكتملة`);
});

document.getElementById('prevLessonBtn').addEventListener('click', () => {
  let pIdx = parseInt(phaseSel.value || 0, 10);
  let lIdx = lessonSel.selectedIndex;
  if (lIdx > 0) {
    setSingleLesson((state[pIdx]?.lessons || [])[lIdx - 1]);
  } else if (pIdx > 0) {
    const prevP = pIdx - 1;
    const lessons = state[prevP].lessons;
    selectPhaseAndLesson(prevP, lessons[lessons.length - 1]);
  }
});

document.getElementById('nextLessonBtn').addEventListener('click', () => {
  let pIdx = parseInt(phaseSel.value || 0, 10);
  let lIdx = lessonSel.selectedIndex;
  const currentLessons = state[pIdx]?.lessons || [];
  if (lIdx < currentLessons.length - 1) {
    setSingleLesson((state[pIdx]?.lessons || [])[lIdx + 1]);
  } else if (pIdx < state.length - 1) {
    const nextP = pIdx + 1;
    selectPhaseAndLesson(nextP, state[nextP].lessons[0]);
  }
});

  }

async function copyText(text, msg) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const tmp = document.createElement('textarea');
      tmp.value = text;
      tmp.setAttribute('readonly', '');
      tmp.style.position = 'fixed';
      tmp.style.opacity = '0';
      document.body.appendChild(tmp);
      tmp.select();
      const copied = document.execCommand('copy');
      document.body.removeChild(tmp);
      if (!copied) throw new Error('copy failed');
    }
    showToast(msg);
  } catch (error) {
    showToast('تعذر النسخ تلقائيًا؛ حدّد النص وانسخه يدويًا');
  }
}

document.getElementById('copyPlainBtn').addEventListener('click', () => {
  copyText(output.value, 'تم نسخ البرومت');
});

document.getElementById('copyBtn').addEventListener('click', () => {
  copyText(output.value + AI_EDIT_NOTE, 'تم نسخ البرومت مع تعليمات الحفاظ على القالب');
});

document.getElementById('strongerBtn').addEventListener('click', () => {
  forceExtraDepth = !forceExtraDepth;
  refreshOutput();
  showToast(forceExtraDepth ? 'تم تفعيل التعميق الإضافي' : 'تم إلغاء التعميق الإضافي');
});

function renderEditor() {
  phaseList.innerHTML = '';
  state.forEach((p, pi) => {
    const wrap = document.createElement('div');
    wrap.className = 'editor-phase-card';

    const head = document.createElement('div');
    head.className = 'editor-phase-head';

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.innerHTML = `<span>📁 ${p.name}</span> <span class="phase-badge">${p.lessons.length} درس</span>`;

    const lessonsDiv = document.createElement('div');
    lessonsDiv.className = 'editor-lessons' + (openEditorPhases.has(pi) ? ' open' : '');

    nameEl.onclick = () => {
      lessonsDiv.classList.toggle('open');
      if (openEditorPhases.has(pi)) openEditorPhases.delete(pi);
      else openEditorPhases.add(pi);
    };
    head.appendChild(nameEl);

    head.appendChild(iconBtn('↑', () => {
      if (pi > 0) {
        [state[pi - 1], state[pi]] = [state[pi], state[pi - 1]];
        saveData(); renderEditor(); populateGenerator();
      }
    }));
    head.appendChild(iconBtn('↓', () => {
      if (pi < state.length - 1) {
        [state[pi + 1], state[pi]] = [state[pi], state[pi + 1]];
        saveData(); renderEditor(); populateGenerator();
      }
    }));
    head.appendChild(iconBtn('✕', () => {
      openConfirmModal(
        'حذف المرحلة بالكامل',
        `هل تريد حذف "${p.name}" وجميع دروسها نهائياً؟`,
        () => {
          state.splice(pi, 1);
          saveData(); renderEditor(); populateGenerator();
          showToast('تم حذف المرحلة');
        }
      );
    }, true));

    wrap.appendChild(head);

    p.lessons.forEach((l, li) => {
      const item = document.createElement('div');
      item.className = 'editor-lesson-row';
      const lname = document.createElement('div');
      lname.className = 'lname';
      lname.textContent = l;
      item.appendChild(lname);

      item.appendChild(iconBtn('↑', () => {
        if (li > 0) {
          [p.lessons[li - 1], p.lessons[li]] = [p.lessons[li], p.lessons[li - 1]];
          saveData(); renderEditor(); populateGenerator();
        }
      }));
      item.appendChild(iconBtn('↓', () => {
        if (li < p.lessons.length - 1) {
          [p.lessons[li + 1], p.lessons[li]] = [p.lessons[li], p.lessons[li + 1]];
          saveData(); renderEditor(); populateGenerator();
        }
      }));
      item.appendChild(iconBtn('✕', () => {
        p.lessons.splice(li, 1);
        saveData(); renderEditor(); populateGenerator();
      }, true));

      lessonsDiv.appendChild(item);
    });

    const addRow = document.createElement('div');
    addRow.className = 'flex-row';
    addRow.style.marginTop = '12px';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'اسم الدرس الجديد...';
    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-primary';
    addBtn.textContent = '+ إضافة';
    addBtn.onclick = () => {
      const v = input.value.trim();
      if (!v) return;
      p.lessons.push(v);
      input.value = '';
      saveData(); renderEditor(); populateGenerator();
      showToast('تمت إضافة الدرس بنجاح');
    };
    addRow.appendChild(input);
    addRow.appendChild(addBtn);
    lessonsDiv.appendChild(addRow);

    wrap.appendChild(lessonsDiv);
    phaseList.appendChild(wrap);
  });
}

function iconBtn(txt, onClick, danger) {
  const b = document.createElement('button');
  b.className = 'icon-btn' + (danger ? ' danger' : '');
  b.textContent = txt;
  b.onclick = onClick;
  return b;
}

document.getElementById('addPhaseBtn').addEventListener('click', () => {
  const input = document.getElementById('newPhaseInput');
  const v = input.value.trim();
  if (!v) return;
  state.push({ name: v, lessons: [] });
  input.value = '';
  saveData(); renderEditor(); populateGenerator();
  showToast('تمت إضافة المرحلة الجديدة');
});

document.getElementById('resetBtn').addEventListener('click', () => {
  openConfirmModal(
    'استعادة المنهج الأصلي',
    'هل أنت متأكد من استعادة القائمة الأصلية الافتراضية؟ سيتم مسح أي تعديلات قمت بإضافتها.',
    () => {
      state = defaultState();
      saveData(); renderEditor(); populateGenerator();
      showToast('تمت استعادة المنهج الأصلي');
    }
  );
});

document.getElementById('exportJsonBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cybersecurity_roadmap.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('📥 تم تحميل ملف المنهج JSON');
});

const tabGen = document.getElementById('tabGen');
const tabEdit = document.getElementById('tabEdit');
const panelGen = document.getElementById('panelGen');
const panelEdit = document.getElementById('panelEdit');

tabGen.addEventListener('click', () => {
  tabGen.classList.add('active');
  tabEdit.classList.remove('active');
  panelGen.classList.add('active');
  panelEdit.classList.remove('active');
});

tabEdit.addEventListener('click', () => {
  tabEdit.classList.add('active');
  tabGen.classList.remove('active');
  panelEdit.classList.add('active');
  panelGen.classList.remove('active');
  renderEditor();
});

document.getElementById('mobileMenuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('mobile-open');
});

loadData();
populateGenerator();
</script>
</body>
</html>
